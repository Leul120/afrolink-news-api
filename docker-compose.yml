# Infrastructure dependencies for local development.
# Run `docker compose up -d` then `npm run dev`.
services:
  postgres:
    image: postgres:16-alpine
    container_name: afrolink-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: afrolink
      POSTGRES_PASSWORD: afrolink
      POSTGRES_DB: afrolink_news
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U afrolink -d afrolink_news']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: afrolink-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  redisdata:
